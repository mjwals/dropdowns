<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>multiDropDowns</title>
    <link href="multidropdowns.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/849cbce7c6.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="dropdown-wrapper">
      <button class="dropdown-button">
        Click Me
        <span class="caret"><i class="fas fa-chevron-down"></i></span>
      </button>
      <ul class="dropdown-menu">
        <li><a href="https://www.bbc.co.uk" target="_blank">BBC</a></li>
        <li><a href="#">link 2</a></li>
        <li><a href="#">link 3</a></li>
      </ul>
    </div>

    <div class="dropdown-wrapper">
      <button class="dropdown-button">
        Click Me
        <span class="caret"><i class="fas fa-chevron-down"></i></span>
      </button>
      <ul class="dropdown-menu">
        <li><a href="#">link 1</a></li>
        <li><a href="#">link 2</a></li>
        <li><a href="#">link 3</a></li>
        <li><a href="#">link 4</a></li>
        <li><a href="#">link 5</a></li>
      </ul>
    </div>

    <script src="multidropdowns.js"></script>
  </body>
</html>
